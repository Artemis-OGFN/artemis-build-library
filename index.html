<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Artemis Builds Library</title>
  <link href="https://fonts.googleapis.com/css2?family=Rajdhani:wght@400;500;600;700&family=Orbitron:wght@700;900&display=swap" rel="stylesheet" />
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    body {
      background: #0a0a0f;
      color: #fff;
      font-family: 'Rajdhani', sans-serif;
      min-height: 100vh;
      padding: 2rem 2rem 5rem;
    }

    .wrapper { max-width: 1200px; margin: 0 auto; }

    .page-title {
      font-family: 'Orbitron', monospace;
      font-size: clamp(1.8rem, 4vw, 2.8rem);
      font-weight: 900;
      letter-spacing: 0.04em;
      background: linear-gradient(135deg, #fff 30%, #555);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
    }

    .page-sub {
      color: #555;
      margin-top: 0.4rem;
      font-size: 0.9rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .pills {
      display: flex;
      flex-wrap: wrap;
      gap: 0.5rem;
      margin: 1.8rem 0 2.2rem;
    }

    .pill {
      padding: 0.4rem 1rem;
      border-radius: 9999px;
      font-family: 'Orbitron', monospace;
      font-size: 0.62rem;
      font-weight: 700;
      letter-spacing: 0.06em;
      cursor: pointer;
      border: 1.5px solid #2a2a2a;
      color: #555;
      background: transparent;
      transition: all 0.15s ease;
    }
    .pill:hover { filter: brightness(1.3); }
    .pill.active-all {
      border-color: #fff;
      color: #fff;
      background: rgba(255,255,255,0.08);
    }

    .chapter { margin-bottom: 0.5rem; }

    .chapter-header {
      display: flex;
      align-items: baseline;
      flex-wrap: wrap;
      gap: 0.7rem;
      margin-bottom: 0.4rem;
    }

    .chapter-name {
      font-family: 'Orbitron', monospace;
      font-size: 1rem;
      font-weight: 700;
      letter-spacing: 0.1em;
    }

    .chapter-subtitle {
      color: #444;
      font-size: 0.82rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
    }

    .chapter-count {
      color: #2e2e2e;
      font-size: 0.72rem;
      letter-spacing: 0.08em;
      margin-left: auto;
    }

    .chapter-line {
      height: 2px;
      border-radius: 2px;
      margin-bottom: 1rem;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
      gap: 0.85rem;
    }

    .card {
      position: relative;
      background: #0e0e16;
      border: 1px solid rgba(255,255,255,0.06);
      border-radius: 10px;
      padding: 1rem 1.1rem 1rem;
      overflow: hidden;
      transition: transform 0.18s ease, border-color 0.2s, box-shadow 0.2s;
      text-decoration: none;
      color: inherit;
      display: block;
      cursor: pointer;
    }
    .card:hover { transform: translateY(-3px); }

    .card-top-line {
      position: absolute;
      top: 0; left: 0; right: 0;
      height: 2px;
      opacity: 0;
      transition: opacity 0.2s;
      border-radius: 10px 10px 0 0;
    }
    .card:hover .card-top-line { opacity: 1; }

    .card-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.58rem;
      font-weight: 700;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      margin-bottom: 0.35rem;
    }

    .card-name {
      font-weight: 700;
      font-size: 1rem;
      color: #ccc;
      line-height: 1.2;
      margin-bottom: 0.15rem;
      transition: color 0.15s;
    }
    .card:hover .card-name { color: #fff; }

    .card-theme {
      font-size: 0.78rem;
      color: #4a4a5a;
      font-weight: 500;
      letter-spacing: 0.03em;
      margin-bottom: 0.8rem;
    }

    .card-meta {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 0.3rem 0.5rem;
      border-top: 1px solid rgba(255,255,255,0.05);
      padding-top: 0.65rem;
      margin-top: 0.1rem;
    }

    .meta-item {
      display: flex;
      flex-direction: column;
      gap: 0.05rem;
    }

    .meta-label {
      font-family: 'Orbitron', monospace;
      font-size: 0.48rem;
      letter-spacing: 0.1em;
      text-transform: uppercase;
      color: #333;
    }

    .meta-value {
      font-size: 0.78rem;
      font-weight: 600;
      color: #666;
      letter-spacing: 0.02em;
      transition: color 0.15s;
    }
    .card:hover .meta-value { color: #888; }

    .card-dl {
      position: absolute;
      top: 0.9rem;
      right: 0.9rem;
      opacity: 0;
      transition: opacity 0.2s;
    }
    .card:hover .card-dl { opacity: 1; }
    .card-dl svg { display: block; }

    .card-badge {
      font-family: 'Orbitron', monospace;
      font-weight: 900;
      font-size: 3.5rem;
      line-height: 1;
      opacity: 0.04;
      position: absolute;
      right: -0.3rem;
      bottom: -0.6rem;
      pointer-events: none;
      transition: opacity 0.2s;
    }
    .card:hover .card-badge { opacity: 0.09; }

    .divider {
      height: 1px;
      background: linear-gradient(to right, transparent, rgba(255,255,255,0.07), transparent);
      margin: 2.5rem 0;
    }
  </style>
</head>

let activeChapter = null;

function hex2rgba(hex, a) {
  const r = parseInt(hex.slice(1,3),16);
  const g = parseInt(hex.slice(3,5),16);
  const b = parseInt(hex.slice(5,7),16);
  return `rgba(${r},${g},${b},${a})`;
}

function renderAll() {
  const pillsEl = document.getElementById('pills');
  pillsEl.innerHTML = '';

  const allPill = document.createElement('button');
  allPill.className = 'pill' + (activeChapter === null ? ' active-all' : '');
  allPill.textContent = 'ALL';
  allPill.onclick = () => { activeChapter = null; renderAll(); };
  pillsEl.appendChild(allPill);

  CHAPTERS.forEach(ch => {
    const p = document.createElement('button');
    p.className = 'pill';
    p.textContent = ch.label.toUpperCase();
    const isActive = activeChapter === ch.id;
    p.style.borderColor = isActive ? ch.accent : '#2a2a2a';
    p.style.color       = isActive ? ch.accent : '#555';
    p.style.background  = isActive ? hex2rgba(ch.accent, 0.1) : 'transparent';
    p.onclick = () => { activeChapter = activeChapter === ch.id ? null : ch.id; renderAll(); };
    pillsEl.appendChild(p);
  });

  const chaptersEl = document.getElementById('chapters');
  chaptersEl.innerHTML = '';

  const visible = activeChapter !== null
    ? CHAPTERS.filter(c => c.id === activeChapter)
    : CHAPTERS;

  visible.forEach((ch, ci) => {
    const wrap = document.createElement('div');
    wrap.className = 'chapter';

    const hdr = document.createElement('div');
    hdr.className = 'chapter-header';
    hdr.innerHTML = `
      <span class="chapter-name" style="color:${ch.accent}">${ch.label.toUpperCase()}</span>
      <span class="chapter-subtitle">${ch.subtitle}</span>
      <span class="chapter-count">${ch.seasons.length} season${ch.seasons.length > 1 ? 's' : ''}</span>
    `;
    wrap.appendChild(hdr);

    const line = document.createElement('div');
    line.className = 'chapter-line';
    line.style.background = `linear-gradient(to right, ${hex2rgba(ch.accent, 0.55)}, transparent)`;
    wrap.appendChild(line);

    const grid = document.createElement('div');
    grid.className = 'grid';

    ch.seasons.forEach(s => {
      const card = document.createElement('a');
      card.className = 'card';
      card.href   = s.url;
      card.target = '_blank';
      card.rel    = 'noopener noreferrer';

      card.innerHTML = `
        <div class="card-top-line" style="background:linear-gradient(to right,transparent,${ch.accent},transparent)"></div>
        <div class="card-dl" style="color:${ch.accent}">
          <svg width="13" height="13" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"/>
            <polyline points="7 10 12 15 17 10"/>
            <line x1="12" y1="15" x2="12" y2="3"/>
          </svg>
        </div>
        <div class="card-label" style="color:${ch.accent}">S${s.n} &nbsp;·&nbsp; v${s.version}</div>
        <div class="card-name">${s.name}</div>
        <div class="card-theme">${s.theme}</div>
        <div class="card-meta">
          <div class="meta-item">
            <span class="meta-label">SIZE</span>
            <span class="meta-value">${s.size}</span>
          </div>
          <div class="meta-item">
            <span class="meta-label">RELEASED</span>
            <span class="meta-value">${s.released}</span>
          </div>
          <div class="meta-item" style="grid-column:1/-1">
            <span class="meta-label">DOWNLOADS</span>
            <span class="meta-value">${s.downloads}</span>
          </div>
        </div>
        <div class="card-badge" style="color:${ch.accent}">${s.n}</div>
      `;

      card.addEventListener('mouseenter', () => {
        card.style.borderColor = hex2rgba(ch.accent, 0.45);
        card.style.boxShadow   = `0 8px 30px ${hex2rgba(ch.accent, 0.12)}, inset 0 0 0 1px ${hex2rgba(ch.accent, 0.25)}`;
      });
      card.addEventListener('mouseleave', () => {
        card.style.borderColor = 'rgba(255,255,255,0.06)';
        card.style.boxShadow   = 'none';
      });

      grid.appendChild(card);
    });

    wrap.appendChild(grid);

    if (ci < visible.length - 1) {
      const div = document.createElement('div');
      div.className = 'divider';
      wrap.appendChild(div);
    }

    chaptersEl.appendChild(wrap);
  });
}

renderAll();
